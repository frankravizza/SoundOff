name: Build and audio tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Swift version
        run: swift --version
      - name: Test audio processing
        run: ./test.sh
      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh "$RUNNER_TEMP/SoundOff.app"
      - name: Verify application signature and architectures
        run: |
          codesign --verify --strict "$RUNNER_TEMP/SoundOff.app"
          lipo -verify_arch arm64 x86_64 "$RUNNER_TEMP/SoundOff.app/Contents/MacOS/SoundOff"
