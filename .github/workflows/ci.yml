name: Build and audio tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show Swift version
        run: swift --version
      - name: Test audio processing
        run: ./test.sh
      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh "$RUNNER_TEMP/SoundOff.app"
      - name: Verify application signature and architectures
        run: |
          codesign --verify --strict "$RUNNER_TEMP/SoundOff.app"
          lipo "$RUNNER_TEMP/SoundOff.app/Contents/MacOS/SoundOff" -verify_arch arm64 x86_64
